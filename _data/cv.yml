    I work where machine learning meets the messy reality of the systems that have
    to run it. My research keeps returning to one question: when an AI pipeline
    produces a claim or an artifact, what does it actually take to trust it?
    Language models today are fluent, confident, routinely wrong in ways that are
    hard to detect, and they produce artifacts that often cannot be reproduced even
    by the person who generated them. My dissertation, executable reliability for
    AI systems, argues that what an AI system claims about itself, whether about
    its outputs, its dependencies, or its resource behaviour, should be testable by
    anyone, not just by the team that built it.
