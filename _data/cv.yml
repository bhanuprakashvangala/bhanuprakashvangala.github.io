  - id: pick-and-spin
    ref: 4
    year: 2026
    title: "Resource-Aware Multi-Model Serving for GPU Cloud Infrastructure (Pick-and-Spin)"
    authors: ["Bhanu Prakash Vangala", "Tanu Malik"]
    venue: "IEEE CLOUD 2026"
    venue_full: "IEEE International Conference on Cloud Computing 2026"
    status: accepted
    kind: "Oral"
    tags: [orchestration, systems, inference]
    image: "images/AdaptiveLLMaaS.png"
    links: []
    highlights: "Nine models from 1B to 27B routed by Thompson Sampling with a cold-start state machine. 310,190 requests on NRP Nautilus: 61% GPU utilization against 31% for static deployment, cutting GPU-hours by 46%."
    summary: >-
      Serving many fine-tuned models on a fixed GPU pool forces a choice between
      keeping everything warm (expensive) and cold-starting on demand (slow).
      Pick-and-Spin treats routing as a bandit problem and makes residency an
      explicit, learned decision rather than a static policy.
    kb: >-
      A Kubernetes-native multi-tenant serving framework. It classifies incoming
      queries by complexity, routes them across nine models from 1B to 27B
      parameters using Thompson Sampling, and manages warm pools on shared HPC
      infrastructure through a custom cold-start state machine. Evaluated over
      310,190 inference requests on the NRP Nautilus cluster. This is the system
      behind the Model Router demo on this site.

