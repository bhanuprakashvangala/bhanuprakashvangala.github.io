    experience, plus industry research experience at Microsoft. My work asks whether
    LLM-based agentic systems can be trusted and reproduced: how to route requests
    across many self-hosted models without wasting GPUs, why code written by coding
    agents runs for its author and fails for everyone else, and how to tell when a
    model's output is faithful to its sources. I was a Google Ph.D. Fellowship
