# -----------------------------------------------------------------------------
# THE THREE THREADS
#   The spine of the dissertation. Rendered near the top of the homepage so a
#   reader sees the argument before the list of papers.
# -----------------------------------------------------------------------------
threads:
  - id: trustworthy
    n: "01"
    title: "Trustworthy outputs"
    lead: "Catching hallucinations in scientific LLMs"
    text: >-
      A benchmark and a multi-stage detector for hallucination in materials-science
      question answering, combining self-consistency checking, retrieval against
      curated sources, and a knowledge graph that flags low-connectivity fact
      fragments as likely fabrications. It cuts hallucination rates by about 30%
      and reaches F1 0.95 on cross-domain inconsistency detection. What matters is
      not the number but that the pipeline is auditable: a reviewer can ask why a
      response was flagged and get a real answer rather than a confidence score.
    refs: ["hallumat", "halluformer"]
    tag: hallucination

  - id: reproducible
    n: "02"
    title: "Reproducible artifacts"
    lead: "Can anyone else actually run it?"
    text: >-
      100 standardised prompts given to Claude, Codex and Gemini agents, and the
      300 resulting projects executed in clean containers. Only 68.3% ran out of
      the box: Python 89%, Java 44%. The agents declared about three dependencies
      per project; the projects pulled in around 49 at runtime, a 13.5x gap
      absorbed by whoever debugs the code afterward. "It compiled on my machine"
      is not the same as "it is reproducible", and the field's benchmarks have been
      quietly measuring the wrong thing.
    refs: ["not-reproducible", "env-gap", "beyond-functional-correctness"]
    tag: reproducibility

  - id: accountable
    n: "03"
    title: "Accountable systems at scale"
    lead: "Serving LLMs efficiently and accountably"
    text: >-
      A Kubernetes-native multi-tenant serving framework that classifies queries by
      complexity, routes them across nine models from 1B to 27B parameters using
      Thompson Sampling, and manages warm pools through a custom cold-start state
      machine. Across 310,190 inference requests on the NRP Nautilus cluster it
      reached 61% GPU utilization against 31% for static deployment, cutting
      GPU-hours by 46%.
    refs: ["pick-and-spin", "multi-model-orchestration"]
    tag: orchestration

