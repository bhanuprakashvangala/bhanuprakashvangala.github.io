research:
- id: reproducible-containers
  title: Reproducible Containers for Collaborative Analytics
  stack: LLMOps · Kubernetes · HPC
  funder: NASA AIST
  collaborators:
  - name: Dr. Tanu Malik
    org: University of Missouri
  - name: Dr. Ashish Gehani
    org: SRI International
  - name: Dr. Kwo-Sen Kuo
    org: NASA
  - name: Dr. Abhilash Jindal
    org: IIT Delhi
  threads:
  - name: FlexiFlow
    text: Bandit-based model switching, FastAPI routing with GPU telemetry, Prometheus + Grafana observability.
      Demonstrated at SIGMOD.
  - name: Pick-and-Spin
    text: 'Thompson Sampling with a Cold-Start State Machine: 9.2% cold-starts across 310K runs and 61% GPU utilization,
      against 31% for the static baseline.'
  - name: Self-hosting LLMs
    text: Helm + vLLM LLM-as-a-Service on NSF Nautilus with KEDA autoscaling; serverless on AWS SageMaker and Lambda
      with scale-to-zero.
  - name: Coding-agent reproducibility
    text: 300 repositories generated by Claude, Gemini and Codex, replayed via SLURM; the SciUnit ptrace harness
      extended to Java and JavaScript.
- id: trace
  title: 'TRACE: Autonomous Experimentation Lab using Agentic AI'
  stack: Agentic AI · MCP · gRPC
  funder: NSF
  collaborators:
  - name: Dr. Tanu Malik
    org: University of Missouri
  - name: Dr. Matt Maschmann
    org: University of Missouri
  - name: Dr. Derek T. Anderson
    org: University of Missouri
  threads:
  - name: MCP & tooling
    text: Authored custom MCP servers and agent skills wrapping Nanoscribe and SEM instrument APIs; ran 50+ automated
      experiment cycles with per-call provenance.
  - name: Multi-agent orchestration
    text: Coordinated agents with Google ADK and Agent2Agent (A2A) over gRPC and Protocol Buffers, behind a FastAPI
      control plane with pytest and GitHub Actions CI for reproducible runs.
- id: materials-ai
  title: Accelerating Materials Design through AI and Machine Learning
