news:
- date: 09/2026
  new: true
  text: '📄 Our paper [One Threshold Does Not Fit All Languages](/files/papers/one-threshold.pdf) with Navya Vangala was accepted as an **oral** at the [Global South in AI Workshop at NeurIPS 2026](https://sites.google.com/view/globalsouthai-neurips26/home)! We show that each low-resource language needs its own rule for when a model should answer and when to hand off to a human.'
- date: 08/2026
  text: '🧑‍🏫 This fall I am a teaching assistant for Designing End-to-End ML Systems at Mizzou, building hands-on labs on [Chameleon Cloud](https://www.chameleoncloud.org/) and [marimo](https://marimo.io/) notebooks.'
- date: 08/2026
  text: '💼 Wrapped up my summer as a Research Data Science Intern at [Microsoft](https://www.microsoft.com) in Redmond on the Windows Data team, working with [Anqi Cheng](https://www.linkedin.com/in/anqi-cheng-616a5559) and [Arturo Herrera](https://www.linkedin.com/in/juan-arturo-herrera-ph-d-41237191).'
- date: '2026'
  text: '📄 Our paper **CAMP: Consumption-Aware Memory Prediction for Scientific Workflows** got accepted at [WORKS at SC26](https://works-workshop.org/), the International Conference for High Performance Computing. Check out the [paper](/files/papers/camp.pdf) and [code](https://github.com/bhanuprakashvangala/CAMP).'
- date: 07/2026
  text: '🎤 Presented [Pick and Spin](/files/papers/pick-and-spin.pdf) as an oral at [IEEE CLOUD 2026](https://services.conferences.computer.org/2026/cloud/) in Sydney, Australia.'
- date: 07/2026
  text: '🎤 Presented [AI-Generated Code Is Not Reproducible (Yet)](https://doi.org/10.1145/3820002.3828581) as an oral at [ACM REP 2026](https://www.tudelft.nl/en/events/2026/eemcs/2026-acm-conference-on-reproducibility-and-replicability) at TU Delft, Netherlands.'
- date: '2026'
  text: '🏆 Selected for the **Top 100** at the ACM Doctoral Summit.'
- date: 06/2026
  text: '📄 **Pick and Spin** was accepted as an **oral** at [IEEE CLOUD 2026](https://services.conferences.computer.org/2026/cloud/)! Cold-start-aware routing for self-hosted LLMs that cuts GPU-hours by 46%. Check out the [paper](/files/papers/pick-and-spin.pdf).'
- date: 05/2026
  text: '📄 **AI-Generated Code Is Not Reproducible (Yet)** was accepted as an **oral** at [ACM REP 2026](https://www.tudelft.nl/en/events/2026/eemcs/2026-acm-conference-on-reproducibility-and-replicability)! We ask whether code written by AI coding agents actually runs on someone else''s machine. Check out the [paper](https://doi.org/10.1145/3820002.3828581).'
- date: 04/2026
  text: '✈️ Received the **EECS Graduate Travel Fellowship** from the University of Missouri College of Engineering.'
- date: 04/2026
  text: '✈️ Awarded a [Chameleon Cloud Travel Award](https://engineering.missouri.edu/2026/exploring-how-ai-can-strengthen-research-reproducibility/) (top 10 proposals) and presented **Evaluating Dependency Gaps in LLM-Generated Code** at the Sixth Chameleon User Meeting, NCAR Mesa Lab, Boulder, Colorado.'
- date: 03/2026
  text: '🎤 Gave an invited talk at the MINDFUL Seminar at the University of Missouri.'
- date: 01/2026
  text: '🎤 Presented two orals at AAAI 2026 in Singapore: [AI-Generated Code Is Not Reproducible (Yet)](https://arxiv.org/abs/2512.22387) at the [RAI Workshop](https://reproducibleai.github.io/) and [Efficient Multi-Model Orchestration for Self-Hosted LLMs](https://arxiv.org/abs/2512.22402) at the [DAI Workshop](https://dai-workshop.github.io/).'
- date: 01/2026
  text: '📝 Submitted **Code That Works, Environments That Don''t**, an extended 1,000-run study, to [AI Magazine](https://onlinelibrary.wiley.com/journal/23719621). The next version is becoming a public benchmark.'
- date: 12/2025
  text: '📄 **AI-Generated Code Is Not Reproducible (Yet)** was accepted at the [RAI Workshop at AAAI 2026](https://reproducibleai.github.io/). Check out the [paper](https://arxiv.org/abs/2512.22387).'
