assistant:
  greeting: Hi. I answer from Bhanu's CV, papers and projects, and from nothing else. Ask about the research, where
    he has worked, or how to get hold of him. I will point you at the section each answer came from so you can check
    it yourself.
  suggestions:
  - What is his research actually about?
  - What did he build at Microsoft?
  - What are the AAAI 2026 workshop papers?
  - Explain Pick-and-Spin
  - Is he open to collaborating?
  facts:
  - id: contact
    title: Contact & availability
    section: '#about-me'
    text: Bhanu is reachable at bv3hz@umsystem.edu. He is a Ph.D. candidate at the University of Missouri expecting
      to graduate in May 2027, based in Columbia, Missouri, and open to research collaborations, internships, and
      speaking invitations. He completed a Research Data Science internship at Microsoft in Redmond, Washington
      in summer 2026.
  - id: research-statement
    title: Research statement
    section: '#about-me'
    text: 'His work sits at the intersection of three questions. Orchestration: when many language models share
      limited GPU capacity, which model should answer a given request, and what should stay resident? His Pick-and-Spin
      router treats this as a bandit problem and reached 61% GPU utilization against a 31% static baseline. Reproducibility:
      code generated by AI coding agents usually runs for its author and fails for everyone else because the environment
      specification is incomplete. He audited 300 agent-generated projects and found 68.3% reproduction success
      and a 13.5x dependency gap between what agents declare and what the code needs. Trust: whether a model''s
      output is faithful to its sources, measured with benchmarks like HalluMatData and detectors like HalluFormer
      rather than by impression.'
  - id: funding
    title: Funding and collaborators
    section: '#research'
    text: His research has been funded by NASA (AIST), the NSF, and the Department of Defense through ERDC. Collaborators
      include Dr. Tanu Malik and Dr. Jianlin Cheng at the University of Missouri, Dr. Ashish Gehani at SRI International,
      Dr. Kwo-Sen Kuo at NASA, Dr. Abhilash Jindal at IIT Delhi, and Dr. Chitta Baral and Dr. Lenore Dai at Arizona
      State University.
  - id: infrastructure
    title: Infrastructure experience
    section: '#experience'
    text: He has deployed and operated LLM inference on the NSF Nautilus cluster of the National Research Platform
      using Kubernetes, Helm, vLLM and KEDA autoscaling, managing GPU quotas and deployment automation for nine
      self-hosted models. He has also run serverless inference on AWS SageMaker and Lambda, replayed 300 reproducibility
      experiments through SLURM, and built the Cosmos/SCOPE data layer over Azure streams during his Microsoft internship.
