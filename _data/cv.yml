  - id: hallumat
    ref: 8
    year: 2025
    title: "HalluMat: Hallucination Detection in LLMs for Materials Science"
    authors: ["Bhanu Prakash Vangala", "Syed Mahmud", "Prabhat Neupane", "Janani Selvaraj", "Jianlin Cheng"]
    venue: "AAAI 2025"
    venue_full: "AAAI Conference on Artificial Intelligence 2025"
    status: accepted
    kind: "Oral"
    tags: [hallucination, trustworthy-ai, benchmarks]
    image: "images/HalluMat-Portfolio Image.png"
