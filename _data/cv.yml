threads:
- id: trustworthy
  n: '01'
  title: Trustworthy outputs
  lead: Knowing when a scientific answer is invented
  text: A benchmark and a multi-stage detector for hallucination in materials-science question answering, combining
    self-consistency checking, retrieval against curated sources, and a knowledge graph that flags low-connectivity
    fact fragments as likely fabrications. It cuts hallucination rates by about 30% and reaches F1 0.95 on cross-domain
    inconsistency detection. The number is the least interesting part. What I wanted was a pipeline you can interrogate.
    Ask why a response got flagged and you get a reason back, not a score.
  refs:
  - hallumat
  - halluformer
  tag: hallucination
- id: reproducible
  n: '02'
  title: Reproducible artifacts
  lead: Can anyone else actually run it?
  text: '100 standardised prompts given to Claude, Codex and Gemini agents, and the 300 resulting projects executed
    in clean containers. Only 68.3% ran out of the box: Python 89%, Java 44%. The agents declared about three dependencies
    per project; the projects pulled in around 49 at runtime. That 13.5x gap does not disappear. It lands on whoever
    picks the code up next. "It ran on my machine" and "it is reproducible" are two different claims, and our benchmarks
    have quietly been scoring the first one.'
  refs:
  - not-reproducible
  - env-gap
  - beyond-functional-correctness
  tag: reproducibility
- id: accountable
  n: '03'
  title: Accountable systems at scale
  lead: Many models, a fixed number of GPUs
  text: 'A Kubernetes-native multi-tenant serving framework that classifies queries by complexity, routes them across
    a configurable set of self-hosted models using Thompson Sampling, and manages warm pools through a custom cold-start
    state machine. The model set lives in a configuration file, so models can be added or swapped without changing the
    code; the paper evaluates nine, from 1B to 27B parameters. Across 310,190 inference requests on the NRP Nautilus
    cluster it reached 61% GPU utilization against 31% for static deployment, cutting GPU-hours by 46%. Most of that
    comes from one decision: stop holding every model resident when the traffic does not call for it.'
  refs:
  - pick-and-spin
  - multi-model-orchestration
  tag: orchestration
