publications:
  - id: env-spec-gap
    ref: 1
    year: 2026
    title: "The Environment Specification Gap: Dependency Misspecification in LLM-Generated Code"
    authors: ["Bhanu Prakash Vangala", "Ashish Gehani", "Tanu Malik"]
    venue: "TMLR"
    venue_full: "Transactions on Machine Learning Research"
    status: review
    tags: [reproducibility, agents, evaluation]
    image: "images/LLM-as-Service-portfolio-image.png"
    links: []
    highlights: "Extended version of the AAAI '26 study: 1,000 instances, a three-layer dependency framework, and a phantom / hidden / bloat taxonomy of misspecification."
    summary: >-
      Scales the coding-agent reproducibility audit to a thousand instances and
      formalises what "the environment is wrong" actually means: dependencies that
      are hallucinated (phantom), silently relied upon but never declared (hidden),
      or declared and never used (bloat).

  - id: camp
    ref: 2
    year: 2026
    title: "Consumption-Aware Memory Prediction for Scientific Workflows"
    authors: ["Bhanu Prakash Vangala", "Nagarjuna K.", "Tanu Malik"]
    venue: "IEEE Cluster 2026"
    venue_full: "IEEE International Conference on Cluster Computing 2026"
    status: review
    tags: [systems, hpc, provenance]
    image: "images/AdaptiveLLMaaS.png"
    links: []
    highlights: "CAMP: selective eBPF / strace auditing with NGBoost LogNormal predictors; median APE reduction across 35K+ Slurm tasks on AWS ParallelCluster."
    summary: >-
      Scientific jobs are routinely over-provisioned because nobody knows how much
      memory they will actually need. CAMP audits real consumption cheaply and
      predicts a distribution rather than a point estimate, so schedulers can
      reason about risk instead of padding.

  - id: beyond-functional-correctness
    ref: 3
    year: 2026
    title: "Beyond Functional Correctness: Evaluating AI-Generated Software Services"
    authors: ["Bhanu Prakash Vangala", "Ashish Gehani", "Tanu Malik"]
    venue: "ACM REP 2026"
    venue_full: "ACM Conference on Reproducibility and Replicability 2026"
    status: accepted
    kind: "Oral"
    tags: [reproducibility, evaluation, agents]
    image: "images/AdaptiveLLMaaS.png"
    links: []
    highlights: "A reproducibility-aware evaluation that scores environment specification, build reliability and runtime behaviour, not just whether the tests pass."
    summary: >-
      "The tests pass" is a weak acceptance criterion for a generated service.
      This paper proposes what else has to hold before you can claim the artifact
      works.

  - id: pick-and-spin
    ref: 4
    year: 2026
    title: "Pick and Spin: Cold-Start-Aware Routing for Self-Hosted LLM Serving"
    authors: ["Bhanu Prakash Vangala", "Tanu Malik"]
    venue: "IEEE CLOUD 2026"
    venue_full: "IEEE International Conference on Cloud Computing 2026"
    status: accepted
    kind: "Oral"
    tags: [orchestration, systems, inference]
    image: "images/AdaptiveLLMaaS.png"
    links: []
    highlights: "Thompson Sampling routing plus a Cold-Start State Machine: 61% GPU utilization and a 46% GPU-hour reduction across 310K runs."
    summary: >-
      Serving many fine-tuned models on a fixed GPU pool forces a choice between
      keeping everything warm (expensive) and cold-starting on demand (slow).
      Pick-and-Spin treats routing as a bandit problem and makes residency an
      explicit, learned decision rather than a static policy.
    kb: >-
      Reduced cold-starts to 9.2% across 310K runs and raised GPU utilization from
      31% to 61%. This is the system behind the Model Router demo on this site.

  - id: not-reproducible
    ref: 5
    year: 2026
    title: "AI-Generated Code Is Not Reproducible (Yet): Dependency Gaps in Coding Agents"
    authors: ["Bhanu Prakash Vangala", "Ali Adibifar", "Tanu Malik", "Ashish Gehani"]
    venue: "AAAI 2026"
    venue_full: "AAAI Conference on Artificial Intelligence 2026"
    status: accepted
    kind: "Oral"
    tags: [reproducibility, agents, evaluation]
    image: "images/LLM-as-Service-portfolio-image.png"
    links:
      - { label: "Paper", url: "https://arxiv.org/abs/2512.22387" }
    highlights: "A 300-project audit of coding agents: 68.3% reproduction success and a 15× runtime dependency multiplier."
    summary: >-
      Code from coding agents runs where it was written and breaks everywhere else.
      We audited 300 projects generated by Claude, Gemini and Codex and measured how
      often the declared environment fails to match what the code actually needs.
    kb: >-
      Presented at AAAI 2026 in Singapore on 26 January 2026, and earlier at the
      RAI 2025 workshop. Projects were run via SLURM; the SciUnit ptrace harness was
      extended to Java and JavaScript. This study underpins the live Dependency &
      Reproducibility Checker demo on this site.

  - id: multi-model-orchestration
    ref: 6
    year: 2026
    title: "Efficient Multi-Model Orchestration for Self-Hosted LLMs"
    authors: ["Bhanu Prakash Vangala", "Tanu Malik", "Ashish Gehani"]
    venue: "AAAI 2026"
    venue_full: "AAAI Conference on Artificial Intelligence 2026"
    status: accepted
    kind: "Oral"
    tags: [orchestration, systems, inference, agents]
    image: "images/AdaptiveLLMaaS.png"
    links:
      - { label: "Paper", url: "https://arxiv.org/abs/2512.22402" }
    highlights: "Multi-agent routing plus GPU orchestration for cost-efficient self-hosted LLM pipelines."
