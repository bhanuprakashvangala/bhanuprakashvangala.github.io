  - id: benchmarks-leak
    ref: 10
    year: 2026
    title: "Scores That Hold, Benchmarks That Leak: Measuring Dataset Contamination in Public Brain-Tumor MRI Classification"
    authors: ["Bhanu Prakash Vangala", "Sowmya Guda", "Latha Peddi", "Navya Vangala"]
    venue: "IEEE JBHI"
    venue_full: "IEEE Journal of Biomedical and Health Informatics"
    status: review
    tags: [evaluation, benchmarks, medical, vision]
    image: "images/Brain Tumor-Portfolio Image.png"
    links: []
    highlights: "28.8% of the dominant corpus's official test split has a near-twin in its own training split; a second corpus leaks 22.3% byte-identically; 95.5% of traceable test images share a patient with training; file headers containing no anatomy separate tumour from no-tumour at 0.959 balanced accuracy."
    summary: >-
      Brain-tumour MRI classification routinely reports accuracies above 98% on a
      handful of public corpora. A three-layer contamination framework covering
      duplicate, patient and source-label leakage audits those corpora against a
      chest-radiograph negative control, across nine architectures. The
      uncomfortable finding is that removing every leaked test image leaves
      balanced accuracy essentially unchanged: contamination this severe does not
      show up as an inflated score, so deduplication repairs the number without
      repairing the benchmark.
    kb: >-
      Releases the contaminated-file lists, recovered patient identifiers and
      deduplicated splits. Argues dataset integrity is a distinct, measurable axis
      of benchmark quality that a stable leaderboard cannot certify, and that
      reported accuracy on these corpora is not yet evidence about tumour
      recognition.

  - id: evaluation-choices
    ref: 11
    year: 2026
    title: "Evaluation Choices Shape Biomedical ML Claims: A Pediatric Pneumonia Benchmark Case Study"
    authors: ["Bhanu Prakash Vangala"]
    venue: "NeurIPS RMLR"
    venue_full: "NeurIPS RMLR Workshop"
    status: review
    tags: [evaluation, benchmarks, medical, vision]
    image: "images/Pneumonia-Portfolio Image.png"
    links: []
    highlights: "Eight pretrained backbones differ by only 0.026 AUROC, but freezing versus fine-tuning moves AUROC by 0.044 and changing the decision threshold moves balanced accuracy by 0.090. A file-properties-only classifier with no anatomy reaches 0.992 in the training pool and 0.496 on the official split."
    summary: >-
      A biomedical paper is often remembered by one number, and that number reads
      as a property of the model when it is really a property of the evaluation.
      On the Kermany pediatric chest radiograph benchmark, the choice of split,
      training policy, threshold, metric and calibration moves the headline more
      than the choice of architecture does. Ends with a seven-item reporting
      recommendation, each item tied to an effect measured in the study.
    kb: >-
      A partition classifier distinguishes the official test split from the
      training pool at AUC 0.697, rising to 0.898 for normal radiographs, so the
      split is measurably different rather than exchangeable.

