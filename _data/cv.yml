assistant:
  greeting: Hi. I answer from Bhanu's CV, papers and projects, and from nothing else. Ask about his research, publications,
    where he has worked, or how to reach him. Each answer points to the section it came from so you can check it.
  suggestions:
  - What is his research about?
  - What did he do at Microsoft?
  - Which papers were accepted in 2026?
  - Explain Pick and Spin
  - Is he available for full-time roles?
  facts:
  - id: contact
    title: Contact & availability
    section: '#about-me'
    text: Bhanu is reachable at bv3hz@umsystem.edu. He is a Ph.D. candidate in Computer Science at the University of
      Missouri in Columbia, Missouri, advised by Prof. Tanu Malik in the Radiant Lab, and expects to graduate in May
      2027. He is available for full-time roles from mid-2027 and is open to research collaborations and speaking invitations.
  - id: microsoft
    title: Microsoft internship
    section: '#experience'
    text: In summer 2026 (May to August) Bhanu was a Research Data Science Intern at Microsoft in Redmond, Washington,
      on the Windows Data team, working with Anqi Cheng under manager Arturo Herrera. He built TempFE, a temporal
      feature framework for Windows retention telemetry that improved model PR-AUC by 30%, and designed a pre-registered
      six-arm benchmark in which the feature model outperformed TCN and TFT baselines.
  - id: research-statement
    title: Research statement
    section: '#about-me'
    text: 'Bhanu studies whether we can trust what AI systems produce, from hallucinations in language models to the
      reproducibility of code written by AI agents, and he builds benchmarks and systems to measure it and to make
      LLM-based systems reliable and efficient. His dissertation is titled Executable Reliability: Unifying Trust,
      Reproducibility, and Efficiency in LLM-Based Systems. On reproducibility, he built a three-layer dependency audit
      across 1,000 runs, three coding agents and four languages, published at ACM REP 2026 and the RAI Workshop at AAAI
      2026. On efficiency, his Pick and Spin router (IEEE CLOUD 2026) does cold-start-aware routing and orchestration
      across self-hosted LLMs and cut GPU-hours by 46% over 310K+ inference runs. On trust, HalluMat and HalluFormer
      detect hallucinations in LLM output.'
  - id: funding
    title: Funding and collaborators
    section: '#experience'
    text: His research has been supported by NASA AIST, NSF (through the GP-ENGINE project) and DoD ERDC. Collaborators
      include Prof. Tanu Malik and Prof. Jianlin Cheng at the University of Missouri, Dr. Ashish Gehani at SRI International,
      and Dr. Abhilash Jindal at IIT Delhi.
  - id: infrastructure
    title: Infrastructure experience
    section: '#experience'
    text: He has deployed and operated self-hosted LLM inference on the NSF Nautilus cluster of the National Research
      Platform using Kubernetes, Helm, vLLM and KEDA autoscaling, and has run serverless inference on AWS SageMaker and
      Lambda.
