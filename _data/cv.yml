publications:
  - id: env-gap
    ref: 1
    year: 2026
    title: "Code That Works, Environments That Don't: Measuring Environment Reproducibility in AI-Generated Software"
    authors: ["Bhanu Prakash Vangala", "Tanu Malik"]
    venue: "AI Magazine"
    venue_full: "AI Magazine (AAAI)"
    status: review
    tags: [reproducibility, agents, evaluation]
    image: "images/LLM-as-Service-portfolio-image.png"
    links: []
    highlights: "Three agents, four languages, fifty tasks. Dependency-set agreement falls as low as 7% on identical tasks, and newer agents show no improvement."
    summary: >-
      Functional correctness says nothing about whether the environment a coding
      agent declares is the environment its code actually needs. A three-layer
      framework separates declared, runtime-installed, and necessary-and-sufficient
      dependencies, and shows the failure is systematic rather than incidental:
      the widest divergence sits between what an agent declares and what the code
      pulls in at runtime, which points at environment priors learned during
      training as the cause.
    kb: >-
      Keywords: LLM coding agents, dependency specification, environment gap, code
      generation, software supply chain. Establishes environment specification as a
      distinct, measurable axis of code-generation quality that current benchmarks
      do not capture. This paper underpins the Dependency and Reproducibility
      Checker demo on this site.

  - id: camp
    ref: 2
    year: 2026
    title: "Consumption-Aware Memory Prediction for Scientific Workflows"
    authors: ["Bhanu Prakash Vangala", "Nagarjuna K.", "Tanu Malik"]
    venue: "IEEE Cluster 2026"
    venue_full: "IEEE International Conference on Cluster Computing 2026"
    status: review
    tags: [systems, hpc, provenance]
    image: "images/AdaptiveLLMaaS.png"
    links: []
    highlights: "CAMP: selective eBPF / strace auditing with NGBoost LogNormal predictors; median APE reduction across 35K+ Slurm tasks on AWS ParallelCluster."
    summary: >-
      Scientific jobs are routinely over-provisioned because nobody knows how much
      memory they will actually need. CAMP audits real consumption cheaply and
      predicts a distribution rather than a point estimate, so schedulers can
      reason about risk instead of padding.

  - id: beyond-functional-correctness
    ref: 3
    year: 2026
    title: "Beyond Functional Correctness: Evaluating AI-Generated Software Services"
    authors: ["Bhanu Prakash Vangala", "Ashish Gehani", "Tanu Malik"]
