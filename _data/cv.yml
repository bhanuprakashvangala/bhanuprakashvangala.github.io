    highlights: "The HalluMatData benchmark plus hybrid checks: a 30% hallucination reduction and the PHCS consistency metric."
    summary: >-
      A benchmark and detector for hallucination in materials-science LLMs,
      combining retrieval augmentation (IR, NER and semantic similarity) with
      intrinsic consistency checks. Introduces the Paraphrased Hallucination
      Consistency Score, which asks whether a model contradicts itself when the
      same question is worded differently.
    kb: >-
      Presented at the AAAI 2025 Spring Symposium track on AI for Scientific
