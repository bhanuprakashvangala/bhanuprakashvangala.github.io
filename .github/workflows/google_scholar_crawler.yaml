name: Get Citation Data

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch Google Scholar citations
        env:
          GOOGLE_SCHOLAR_ID: qHBOnpkAAAAJ
        run: python google_scholar_crawler/main.py
      - name: Commit updated citation data
        run: |
          if git diff --quiet -- _data/scholar.json; then
            echo "No citation changes."
            exit 0
          fi
          git config user.name "Bhanu Prakash Vangala"
          git config user.email "bv3hz@umsystem.edu"
          git add _data/scholar.json
          git commit -m "Update citation data"
          git push
