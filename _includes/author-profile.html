{%- assign cv = site.data.cv -%}
<div itemscope itemtype="https://schema.org/Person" class="author__profile">

  <div class="author__avatar">
    <img src="{{ cv.profile.avatar | prepend: '/' | relative_url }}"
         alt="Portrait of {{ cv.profile.name }}" width="220" height="220" loading="lazy">
  </div>

  <div class="author__content">
    <h2 class="author__name" itemprop="name">{{ cv.profile.name }}</h2>
    <p class="author__bio" itemprop="jobTitle">{{ cv.profile.role }}</p>
    <p class="author__org">{{ cv.profile.affiliation }}</p>
  </div>

  <div class="author__urls-wrapper">
    <ul class="author__urls social-icons">
      <li><i class="fas fa-fw fa-map-marker-alt" aria-hidden="true"></i> {{ cv.profile.location }}</li>
      {%- for l in cv.links %}
      <li>
        <a href="{% if l.url contains '://' or l.url contains 'mailto:' %}{{ l.url }}{% else %}{{ l.url | relative_url }}{% endif %}">
          <i class="{{ l.icon }} fa-fw" aria-hidden="true"></i> {{ l.label }}
        </a>
      </li>
      {%- endfor %}
    </ul>
  </div>
</div>
