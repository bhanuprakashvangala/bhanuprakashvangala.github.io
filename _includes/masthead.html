<div class="masthead">
  <div class="masthead__inner-wrap">
    <div class="masthead__menu">
      <nav id="site-nav" class="greedy-nav" aria-label="Main navigation">
        <button type="button" aria-label="Toggle menu"><div class="navicon"></div></button>
        <ul class="visible-links">
          <li class="masthead__menu-item masthead__menu-item--lg masthead__menu-home-item">
            <a href="{{ '/' | relative_url }}">{{ site.data.cv.profile.short_name | default: 'Home' }}</a>
          </li>
          {%- for link in site.data.navigation.main %}
          <li class="masthead__menu-item">
            <a href="{{ link.url | relative_url }}"{% if link.spy %} data-spy="{{ link.url | split: '#' | last }}"{% endif %}>{{ link.title }}</a>
          </li>
          {%- endfor %}
        </ul>
        <ul class="hidden-links hidden"></ul>
      </nav>
    </div>

    <button type="button" class="theme-toggle" id="theme-toggle"
            aria-label="Switch colour scheme" aria-pressed="false" title="Switch colour scheme">
      <svg class="icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
        <circle cx="12" cy="12" r="4"/>
        <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
      </svg>
      <svg class="icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>
      </svg>
    </button>
  </div>
</div>
