{%- comment -%}
  Apply the saved colour scheme before first paint so the page never flashes
  light-then-dark. Runs synchronously and on purpose: deferring it would defeat it.
{%- endcomment -%}
<script>
  (function () {
    try {
      var saved = localStorage.getItem('bv-theme');
      if (saved === 'dark' || saved === 'light') {
        document.documentElement.setAttribute('data-theme', saved);
      }
    } catch (e) { /* private mode, blocked storage — fall through to system default */ }
  })();
</script>
