name: Check portfolio
on:
  pull_request:
  push:
    branches: [main, codex/simple-academic-portfolio]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build with the GitHub Pages toolchain
        uses: actions/jekyll-build-pages@v1
      - name: Check pages and local links
        run: python3 scripts/check_site.py
